# Public route for the chatbot. Uses the existing strip-chatbot StripPrefix middleware
# in traefik-edge (traefik-edge does NOT load Middlewares from the skirmshop namespace,
# so we reference the proven one the legacy route used).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: skirmshop-chatbot-public
  namespace: skirmshop
  annotations:
    external-dns.alpha.kubernetes.io/hostname: skirmshop.e-dani.com
    external-dns.alpha.kubernetes.io/target: "57.129.17.172"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints: [websecure]
  ingressClassName: traefik-edge
  routes:
    - match: Host(`skirmshop.e-dani.com`) && PathPrefix(`/chatbot`)
      kind: Rule
      priority: 2000
      middlewares:
        - name: strip-chatbot
          namespace: traefik-edge
      services:
        - name: skirmshop-chatbot-deterministic
          port: 3100
  tls:
    store: { name: default, namespace: traefik-edge }

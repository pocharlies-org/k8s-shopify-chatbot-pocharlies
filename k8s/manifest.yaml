# skirmshop-chatbot — k8s manifests (skirmshop namespace, edge node = sauvage)
# Secret `chatbot-secrets` is created out-of-band from the app's runtime env
# (no vault CLI available yet; migrate to ExternalSecret/Vault later).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-redis
  namespace: skirmshop
spec:
  replicas: 1
  selector: { matchLabels: { app: chatbot-redis } }
  template:
    metadata: { labels: { app: chatbot-redis } }
    spec:
      nodeSelector: { role: edge, kubernetes.io/arch: amd64 }
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      containers:
        - name: redis
          image: redis:8.0.0
          args: ["--save", "", "--appendonly", "no"]   # cache/session only; chat history lives in SQLite
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: chatbot-redis, namespace: skirmshop }
spec:
  selector: { app: chatbot-redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: chatbot-data, namespace: skirmshop }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path   # longhorn CSI is not on the sauvage edge node; pod is pinned here + single replica
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skirmshop-chatbot
  namespace: skirmshop
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO PVC: avoid two pods mounting during rollout
  selector: { matchLabels: { app: skirmshop-chatbot } }
  template:
    metadata: { labels: { app: skirmshop-chatbot } }
    spec:
      enableServiceLinks: false
      imagePullSecrets: [{ name: harbor-pull }]
      nodeSelector: { role: edge, kubernetes.io/arch: amd64 }
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      containers:
        - name: chatbot
          image: harbor.e-dani.com/homelab/skirmshop-chatbot@sha256:c17d2137affb6e429f6987286e372f28d074718ccce93dfefd6f103a01afc6c0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3100 }]
          envFrom: [{ secretRef: { name: chatbot-secrets } }]
          env:
            # cluster-correct overrides (win over envFrom)
            - { name: PORT, value: "3100" }
            - { name: NODE_ENV, value: "production" }
            - { name: OPENCLAW_BINARY, value: "openclaw" }
            - { name: OPENCLAW_AGENT_ID, value: "customersupport" }
            - { name: OPENCLAW_TIMEOUT_SECONDS, value: "120" }
            - { name: BRAIN_URL, value: "https://brain-k8s.lan.e-dani.com" }
            - name: BRAIN_API_KEY
              valueFrom: { secretKeyRef: { name: rag-secrets, key: BRAIN_API_KEY } }
            - name: SHOPIFY_APP_SECRET
              valueFrom: { secretKeyRef: { name: chatbot-secrets, key: SHOPIFY_WEBHOOK_SECRET } }
            - name: LITELLM_API_KEY
              valueFrom: { secretKeyRef: { name: rag-litellm-key, key: LITELLM_KEY } }
            - { name: SUPPORT_DB_PATH, value: "/data/support.db" }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            tcpSocket: { port: 3100 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: 3100 }
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: chatbot-data }
---
apiVersion: v1
kind: Service
metadata: { name: skirmshop-chatbot, namespace: skirmshop }
spec:
  selector: { app: skirmshop-chatbot }
  ports: [{ name: http, port: 80, targetPort: 3100 }]
# IngressRoute (public /chatbot) lives in ingressroute.yaml — applied at cutover
# to avoid conflicting with the legacy-compat route while we verify.

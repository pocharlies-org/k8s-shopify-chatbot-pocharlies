apiVersion: apps/v1
kind: Deployment
metadata:
  name: skirmshop-chatbot-deterministic
  namespace: skirmshop
  annotations:
    rho.skirmshop.es/activation-gate: image-secrets-brain-e2e
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: skirmshop-chatbot-deterministic }
  template:
    metadata:
      labels: { app: skirmshop-chatbot-deterministic }
    spec:
      enableServiceLinks: false
      imagePullSecrets: [{ name: harbor-pull }]
      nodeSelector: { kubernetes.io/arch: amd64 }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: skirmshop-chatbot-deterministic }
      containers:
        - name: chatbot
          image: harbor.lan.e-dani.com/homelab/skirmshop-chatbot:v3.1.14@sha256:af6b9af3f8d7a5999da502a70edb2fe62c50bf38ea53e5ff34f3b0a32d573927
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3100 }]
          envFrom:
            - configMapRef: { name: chatbot-deterministic-config }
            - secretRef: { name: chatbot-deterministic-secrets }
          env:
            - { name: PORT, value: "3100" }
            - { name: NODE_ENV, value: "production" }
            - { name: SHOP_AGENT_MODE, value: "deterministic-multitenant" }
            - { name: SHOPIFY_STORE, value: "ymimst-yh.myshopify.com" }
            - { name: SUPPORT_DB_PATH, value: "/tmp/support.db" }
            - { name: COMMERCE_HA_ENABLED, value: "true" }
            - { name: REDIS_URL, value: "redis://labels-valkey-master.skirmshop.svc.cluster.local:6379/6" }
            - { name: COMMERCE_REDIS_KEY_PREFIX, value: "skirmshop:commerce:v1" }
            - { name: COMMERCE_TELEGRAM_CUSTOMER_BOT_USERNAME, value: "skirmshop_es_bot" }
            - { name: CHAT_TRUSTED_PROXY_IPS, value: "10.42.0.0/16" }
            - name: BRAIN_API_KEY
              valueFrom:
                secretKeyRef: { name: rag-secrets, key: BRAIN_API_KEY }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: skirmshop-chatbot-deterministic
  namespace: skirmshop
spec:
  selector: { app: skirmshop-chatbot-deterministic }
  ports: [{ name: http, port: 3100, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: skirmshop-chatbot-deterministic
  namespace: skirmshop
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: skirmshop-chatbot-deterministic }

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chatbot-deterministic-secrets
  namespace: skirmshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: chatbot-deterministic-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        SHOPIFY_APP_SECRET: "{{ .shopify_app_secret }}"
        SHOPIFY_ADMIN_TOKEN: "{{ .shopify_admin_token }}"
        BRAIN_RELATIONS_API_KEY: "{{ .brain_relations_api_key }}"
        LABELS_INTERNAL_API_TOKEN: "{{ .labels_internal_api_token }}"
        COMMERCE_STATE_KEYRING_JSON: "{{ .commerce_state_keyring_json }}"
        COMMERCE_CHANNEL_TOKEN_WHATSAPP: "{{ .channel_token_whatsapp }}"
        COMMERCE_CHANNEL_TOKEN_TELEGRAM: "{{ .channel_token_telegram }}"
        COMMERCE_CHANNEL_TOKEN_EMAIL: "{{ .channel_token_email }}"
        COMMERCE_CHANNEL_TOKEN_INSTAGRAM: "{{ .channel_token_instagram }}"
        COMMERCE_IDENTITY_SECRET_WHATSAPP: "{{ .identity_secret_whatsapp }}"
        COMMERCE_IDENTITY_SECRET_TELEGRAM: "{{ .identity_secret_telegram }}"
        COMMERCE_IDENTITY_SECRET_EMAIL: "{{ .identity_secret_email }}"
        COMMERCE_IDENTITY_SECRET_INSTAGRAM: "{{ .identity_secret_instagram }}"
  dataFrom:
    - extract:
        key: secret/skirmshop/chatbot-deterministic
  data:
    - secretKey: labels_internal_api_token
      remoteRef:
        key: secret/skirmshop/labels
        property: INTERNAL_API_TOKEN

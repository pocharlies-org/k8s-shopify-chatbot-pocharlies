apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chatbot-report-secrets
  namespace: skirmshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: chatbot-report-secrets
    creationPolicy: Owner
  data:
    - secretKey: PG_DSN
      remoteRef:
        key: secret/skirmshop/shopify-chatbot-reporting
        property: PG_DSN
    - secretKey: REPORT_EMAIL
      remoteRef:
        key: secret/skirmshop/shopify-chatbot-reporting
        property: REPORT_EMAIL

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chatbot-report-secrets
  namespace: skirmshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: chatbot-report-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        PG_DSN: "host=postgres-shared-rw.databases.svc.cluster.local port=5432 dbname=skirmshop user={{ .pg_username }} password={{ .pg_password }}"
        REPORT_EMAIL: "{{ .report_email }}"
  data:
    - secretKey: pg_username
      remoteRef:
        key: secret/skirmshop/postgres
        property: app-username
    - secretKey: pg_password
      remoteRef:
        key: secret/skirmshop/postgres
        property: app-password
    - secretKey: report_email
      remoteRef:
        key: secret/skirmshop/shopify-chatbot-reporting
        property: REPORT_EMAIL

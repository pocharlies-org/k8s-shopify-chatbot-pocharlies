apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chatbot-deterministic-secrets
  namespace: skirmshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: chatbot-deterministic-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SHOPIFY_APP_SECRET
      remoteRef:
        key: skirmshop/chatbot-deterministic
        property: shopify_app_secret
    - secretKey: COMMERCE_STATE_KEYRING_JSON
      remoteRef:
        key: skirmshop/chatbot-deterministic
        property: commerce_state_keyring_json
    - secretKey: BRAIN_RELATIONS_API_KEY
      remoteRef:
        key: skirmshop/chatbot-deterministic
        property: brain_relations_api_key
    - secretKey: SHOPIFY_ADMIN_TOKEN
      remoteRef:
        key: skirmshop/chatbot-deterministic
        property: shopify_admin_token
    - secretKey: CHANNEL_TOKEN_WHATSAPP
      remoteRef:
        key: skirmshop/chatbot-deterministic
        property: channel_token_whatsapp
    - secretKey: CHANNEL_TOKEN_TELEGRAM
      remoteRef:
        key: skirmshop/chatbot-deterministic
        property: channel_token_telegram
    - secretKey: CHANNEL_TOKEN_EMAIL
      remoteRef:
        key: skirmshop/chatbot-deterministic
        property: channel_token_email
    - secretKey: CHANNEL_TOKEN_INSTAGRAM
      remoteRef:
        key: skirmshop/chatbot-deterministic
        property: channel_token_instagram
    - secretKey: IDENTITY_SECRET_WHATSAPP
      remoteRef:
        key: skirmshop/chatbot-deterministic
        property: identity_secret_whatsapp
    - secretKey: IDENTITY_SECRET_TELEGRAM
      remoteRef:
        key: skirmshop/chatbot-deterministic
        property: identity_secret_telegram
    - secretKey: IDENTITY_SECRET_EMAIL
      remoteRef:
        key: skirmshop/chatbot-deterministic
        property: identity_secret_email
    - secretKey: IDENTITY_SECRET_INSTAGRAM
      remoteRef:
        key: skirmshop/chatbot-deterministic
        property: identity_secret_instagram
    - secretKey: LABELS_INTERNAL_API_TOKEN
      remoteRef:
        key: skirmshop/labels
        property: INTERNAL_API_TOKEN
